name: build-windows-engines

on:
  workflow_dispatch:
    inputs:
      dart-versions:
        description: 'Comma-separated Dart versions (empty = all from BUILD_VERSIONS.txt)'
        required: false
        default: ''
        type: string
      publish-release:
        description: 'Create/update a Release with all built engines (tag builds always publish)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 生成矩阵：默认读取 BUILD_VERSIONS.txt（与 fler-dart 全版本覆盖对齐），
  # workflow_dispatch 可用 `dart-versions` 只构建指定版本。
  prepare:
    name: prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate matrix
        id: gen
        shell: bash
        env:
          INPUT_VERSIONS: ${{ inputs.dart-versions }}
        run: |
          python - <<'PY'
          import json, os
          raw = (os.environ.get('INPUT_VERSIONS') or '').strip()
          if raw:
              versions = [v.strip() for v in raw.replace(';', ',').split(',') if v.strip()]
          else:
              versions = []
              with open('BUILD_VERSIONS.txt', encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith('#'):
                          versions.append(line)
          # 3.12.2 / 3.13.5 是已验证基线；其余版本先允许失败（continue-on-error），
          # 待全矩阵实测后逐步收紧。
          validated = {'3.12.2', '3.13.5'}
          include = [{'dart': v, 'experimental': v not in validated} for v in versions]
          matrix = {'include': include}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          print(f'[matrix] {len(include)} versions')
          print(json.dumps(include, indent=1))
          PY
      - name: Write version list artifact
        run: cp BUILD_VERSIONS.txt versions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: version-list
          path: versions.txt
          if-no-files-found: error

  # Build one engine DLL per Dart version (Windows x64).
  build-engine:
    name: engine dart-${{ matrix.dart }}
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: python -m pip install --disable-pip-version-check requests

      - name: Cache blutter + Dart SDK sources
        uses: actions/cache@v4
        with:
          path: |
            src/blutter
            build/cache
          key: fiet-win-dart-src-${{ hashFiles('scripts/fetch_blutter.py', 'scripts/fetch_dartsdk.py', 'BUILD_VERSIONS.txt') }}

      - name: Build engine + package
        shell: pwsh
        run: |
          ./scripts/build.ps1 -DartVersion '${{ matrix.dart }}'
        timeout-minutes: 110

      - name: Smoke (load + exports)
        shell: pwsh
        run: |
          ./scripts/smoke.ps1 -EngineDir "dist/dartvm-${{ matrix.dart }}-windows-x64" -LoadOnly
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dartvm-${{ matrix.dart }}-windows-x64
          path: dist/dartvm-${{ matrix.dart }}-windows-x64*
          if-no-files-found: warn

  manifest:
    name: manifest
    if: always()
    needs: [prepare, build-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dartvm-*-windows-x64
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build manifest.json
        run: |
          python scripts/make_manifest.py --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          cat manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: manifest.json
      - name: Create/update release (tag builds or manual publish)
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish-release == true
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.zip
            dist/**/SHA256SUMS.txt
          fail_on_unmatched_files: false
